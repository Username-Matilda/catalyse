name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    env:
      # Never connected to: `prisma.config.ts` refuses to load without a URL, and the
      # generated client is needed for typecheck.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalyse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  unit-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalyse
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalyse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      # Coverage must stay at 100% lines/statements (vitest.config.mts enforces it). The HTML
      # report is uploaded even on failure so the missed lines can be read from the run page.
      - name: Coverage summary
        if: always()
        run: |
          echo '## Unit test coverage' >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const s = require("./coverage/coverage-summary.json").total
            const row = (k) => `| ${k} | ${s[k].pct}% | ${s[k].covered}/${s[k].total} |`
            console.log("| Metric | Coverage | Covered |\n|---|---|---|")
            for (const k of ["lines", "statements", "branches", "functions"]) console.log(row(k))
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  e2e-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalyse
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-dummy-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalyse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
