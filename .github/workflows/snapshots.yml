# Visual snapshots: every e2e test photographed in every lane, diffed against
# what main last published, and put up as a page to read in the browser.
#
# Each lane captures in a job of its own; a final job merges them into one
# gallery, uploads it as an artifact, and (once the repository has GitHub
# Pages serving the gh-pages branch) publishes it there and links it from the
# pull request. Until Pages is enabled the artifact is the way to read it.
name: Snapshots

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: snapshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Where the published galleries live: main's at /main, each PR's at /pr/<n>.
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  capture:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [desktop-light, desktop-dark, mobile-light, mobile-dark]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalyse
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-dummy-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalyse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A pull request diffs against main's published pictures. Nothing
      # published yet (or Pages not enabled) leaves every row without a
      # previous picture, which the gallery says outright.
      - name: Pin main's gallery as the baseline
        if: github.event_name == 'pull_request'
        run: npm run snapshots -- --baseline-from="$PAGES_URL/main" || echo "No published baseline to diff against."
      - name: Capture
        run: npm run snapshots -- --project=${{ matrix.lane }}
      - name: Upload the lane's captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots-${{ matrix.lane }}
          path: |
            snapshots/
            !snapshots/pool/
            !snapshots/history.json
          retention-days: 14

  publish:
    needs: capture
    if: always() && github.event.action != 'closed' && needs.capture.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gather every lane
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: snapshots-*
          path: snapshots
          merge-multiple: true
      - name: Build the gallery
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            npm run snapshots -- --export=gallery --baseline-from="$PAGES_URL/main"
          else
            npm run snapshots -- --export=gallery
          fi
      - name: Upload the gallery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots-gallery
          path: gallery/
          retention-days: 30
      # The gh-pages branch is rebuilt as a single commit every time, so the
      # site keeps every gallery still wanted while the branch never grows a
      # history of pictures.
      - name: Publish to GitHub Pages
        id: pages
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.event_name == 'pull_request' && format('pr/{0}', github.event.pull_request.number) || 'main' }}
        run: |
          set -eu
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf site
          if git clone --depth 1 --branch gh-pages "$remote" site 2>/dev/null; then
            rm -rf site/.git
          else
            mkdir site
          fi
          rm -rf "site/$TARGET"
          mkdir -p "site/$(dirname "$TARGET")"
          cp -r gallery "site/$TARGET"
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Snapshots for $TARGET (${GITHUB_SHA::7})"
          git push --force "$remote" gh-pages
          # A push made with the workflow token does not start a Pages build on its own.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true
          echo "url=$PAGES_URL/$TARGET/" >> "$GITHUB_OUTPUT"
      - name: Link the gallery from the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          GALLERY_URL: ${{ steps.pages.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CAPTURE_RESULT: ${{ needs.capture.result }}
        with:
          script: |
            const marker = '<!-- snapshots-gallery -->'
            const { GALLERY_URL, RUN_URL, CAPTURE_RESULT } = process.env
            const where = GALLERY_URL
              ? `[Open the gallery](${GALLERY_URL})`
              : `The gallery is the \`snapshots-gallery\` artifact on [this run](${RUN_URL}); it will be a page here once GitHub Pages serves the gh-pages branch.`
            const state = CAPTURE_RESULT === 'success' ? '' : `\n\nSome lanes did not finish (${CAPTURE_RESULT}); see [the run](${RUN_URL}).`
            const body = `${marker}\n**Visual snapshots** for ${context.sha.slice(0, 7)}: ${where}${state}`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((comment) => comment.body?.startsWith(marker))
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  # A closed pull request's gallery comes down from the site.
  unpublish:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove the pull request's gallery
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: pr/${{ github.event.pull_request.number }}
        run: |
          set -eu
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch gh-pages "$remote" site || exit 0
          cd site
          [ -d "$TARGET" ] || exit 0
          rm -rf .git "$TARGET"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Remove snapshots for $TARGET"
          git push --force "$remote" gh-pages
