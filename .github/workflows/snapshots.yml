# Visual snapshots: every e2e test photographed in every lane, merged into one
# gallery and uploaded as an artifact to read in the browser.
#
# Each lane captures in a job of its own; a final job merges them. The
# workflows here run with a read-only token and no secrets so a fork's pull
# request runs them the same way, which is why this one publishes nowhere:
# the gallery is the `snapshots-gallery` artifact on the run.
name: Snapshots

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: snapshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [desktop-light, desktop-dark, mobile-light, mobile-dark]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalyse
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-dummy-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalyse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture
        run: npm run snapshots -- --project=${{ matrix.lane }}
      - name: Upload the lane's captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots-${{ matrix.lane }}
          path: |
            snapshots/
            !snapshots/pool/
            !snapshots/history.json
          retention-days: 14

  gallery:
    needs: capture
    if: always() && needs.capture.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gather every lane
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: snapshots-*
          path: snapshots
          merge-multiple: true
      - name: Build the gallery
        run: npm run snapshots -- --export=gallery
      - name: Upload the gallery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots-gallery
          path: gallery/
          retention-days: 30
      - name: Say where it is
        env:
          LANES: ${{ needs.capture.result }}
        run: |
          {
            echo '## Visual snapshots'
            echo
            echo 'The gallery is the `snapshots-gallery` artifact on this run: download it and open `index.html`.'
            echo "Lanes: $LANES."
          } >> "$GITHUB_STEP_SUMMARY"
